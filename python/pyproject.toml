[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yasaheni"
dynamic = ["version"]
description = "Run Qwen3.8-27B locally with the YASAKANI engine: OpenAI-compatible server, terminal chat, benchmark and self-check."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.23", "tokenizers>=0.15", "jinja2>=3.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.scripts]
yasaheni = "yasaheni.cli:main"

[project.optional-dependencies]
# Image input: vision.py decodes JPEG/PNG itself, but the server needs Pillow
# to resize request images.
vision = ["Pillow>=10"]

[tool.setuptools]
packages = ["yasaheni"]

[tool.setuptools.dynamic]
version = { attr = "yasaheni.__version__" }
