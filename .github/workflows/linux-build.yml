name: linux-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned to 24.04: ubuntu-latest now resolves to Ubuntu 26.04, whose NVIDIA
    # CUDA repository carries no 12.8 packages (cuda-nvcc-12-8 et al. are
    # "unable to locate"), so the toolkit install step failed before any code
    # was compiled. The ubuntu2404 repository still ships CUDA 12.8.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential

      # Installs the toolkit and puts $CUDA_PATH/bin (nvcc) on PATH for the steps below.
      # 12.8 is the first release that can emit sm_120 (RTX 5090), which the engine needs.
      - name: Install the CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.0"
          method: network
          sub-packages: '["nvcc", "cudart", "crt"]'

      - name: Show the toolchain
        run: |
          nvcc --version
          cmake --version
          ninja --version

      - name: Configure
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="80;86;120"

      - name: Build
        run: cmake --build build-linux --parallel "$(nproc)"

      - name: Check the exported symbols
        run: |
          set -euo pipefail
          so=build-linux/libyskn.so
          test -f "$so" || { echo "::error::$so was not produced"; exit 1; }
          ls -l "$so"
          nm -D --defined-only "$so" > symbols.txt
          grep -E '\bT\s+yskn_open$' symbols.txt || {
            echo "::error::yskn_open is not exported by $so"; head -n 40 symbols.txt; exit 1; }
          echo "yskn_open is exported"

      # The GGUF suites are host-only (no GPU needed), so they can gate every
      # push, not just local runs.
      - name: Run the GGUF test suites
        run: |
          cmake -S tests/gguf -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests --parallel "$(nproc)"
          ctest --test-dir build-tests --output-on-failure
